<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Focus Deck：把杂乱任务整理成现在、接下来、稍后的焦点卡片。">
    <title>Focus Deck</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <p class="eyebrow">FOCUS DECK / LOCAL ONLY</p>
        <h1>把下一步<br><em>放到眼前。</em></h1>
        <p class="lede">粘贴杂乱任务。用 <code>!urgent</code>、<code>@work</code>、<code>@home</code> 轻轻提示它们该落在哪里。</p>
      </header>

      <section class="composer" aria-labelledby="composer-title">
        <div class="composer-heading">
          <h2 id="composer-title">倾倒脑内清单</h2>
          <p>一行一个任务。<kbd>Ctrl</kbd> + <kbd>Enter</kbd> 也可以整理。</p>
        </div>
        <label class="sr-only" for="task-input">任务文本，每行一项</label>
        <textarea id="task-input" rows="7" placeholder="回复项目邮件 !urgent @work&#10;给植物浇水 @home&#10;整理报销单 @work"></textarea>
        <div class="composer-actions">
          <button class="primary-button" id="organize-button" type="button">整理任务 <span aria-hidden="true">↗</span></button>
          <button class="quiet-button" id="clear-button" type="button">清空牌组</button>
          <p class="storage-note" id="storage-note" role="status" aria-live="polite">只保存在这台设备的浏览器里。</p>
        </div>
      </section>

      <section class="deck" aria-label="焦点任务牌组">
        <section class="lane lane-now" aria-labelledby="now-title">
          <div class="lane-heading"><p class="lane-number">01</p><h2 id="now-title">现在</h2><span class="lane-count" id="now-count">0</span></div>
          <p class="lane-note">只留真正要先动手的事。</p>
          <div class="task-list" id="now-list"></div>
        </section>
        <section class="lane lane-next" aria-labelledby="next-title">
          <div class="lane-heading"><p class="lane-number">02</p><h2 id="next-title">接下来</h2><span class="lane-count" id="next-count">0</span></div>
          <p class="lane-note">工作进入视野，但不抢走现在。</p>
          <div class="task-list" id="next-list"></div>
        </section>
        <section class="lane lane-later" aria-labelledby="later-title">
          <div class="lane-heading"><p class="lane-number">03</p><h2 id="later-title">稍后</h2><span class="lane-count" id="later-count">0</span></div>
          <p class="lane-note">它们没消失，只是暂时不占脑子。</p>
          <div class="task-list" id="later-list"></div>
        </section>
      </section>
    </main>
  </body>
</html>
